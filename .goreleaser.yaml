# GoReleaser config: builds comfymeta for every platform and publishes a
# GitHub Release when a v* tag is pushed (see .github/workflows/release.yml).
# Docs: https://goreleaser.com
version: 2

project_name: comfymeta

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/comfymeta
    binary: comfymeta
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # e.g. comfymeta_0.1.0_macos_arm64.tar.gz, comfymeta_0.1.0_windows_amd64.zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    # commit subjects may start with an emoji added by git hooks ("✨ feat: ...")
    exclude:
      - '^\S*\s*(docs|test|chore|ci|style)(\(.*\))?!?:'
